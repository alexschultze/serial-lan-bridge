name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the release and upload its files

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyserial platformio esptool
      - name: Tests
        run: |
          make -C tether-node/sim test
          python -m unittest discover -s tether_host/tests
      - name: Build the release files
        run: tools/make_release.sh "${GITHUB_REF_NAME#v}"
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --title "$GITHUB_REF_NAME"
          --notes-file build/RELEASE_NOTES.md
          $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
