name: ci
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyserial
      - name: C unit tests (ASan/UBSan)
        run: make -C tether-node/sim test
      - name: Python unit and end-to-end tests (including the C engine over a pty)
        run: python -m unittest discover -s tether-host/tests -v

  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4
    steps:
      - uses: actions/checkout@v4
      - name: Build tether-node for ESP32-S3
        run: |
          . $IDF_PATH/export.sh
          cd tether-node
          idf.py set-target esp32s3
          idf.py build
      - uses: actions/upload-artifact@v4
        with:
          name: tether-node-esp32s3
          path: |
            tether-node/build/tether-node.bin
            tether-node/build/bootloader/bootloader.bin
            tether-node/build/partition_table/partition-table.bin
