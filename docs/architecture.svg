<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="900" height="380" fill="#ffffff"/>

  <!-- Wi-Fi side -->
  <rect x="20" y="40" width="170" height="300" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="105" y="66" text-anchor="middle" font-weight="600" fill="#1e3a8a">Wi-Fi network</text>
  <rect x="38" y="95" width="134" height="56" rx="6" fill="#fff" stroke="#3b82f6"/>
  <text x="105" y="119" text-anchor="middle">Wi-Fi clients</text>
  <text x="105" y="138" text-anchor="middle" font-size="12" fill="#475569">apps, browsers</text>
  <rect x="38" y="240" width="134" height="56" rx="6" fill="#fff" stroke="#3b82f6"/>
  <text x="105" y="264" text-anchor="middle">Devices and sites</text>
  <text x="105" y="283" text-anchor="middle" font-size="12" fill="#475569">router, web UIs, internet</text>

  <!-- node -->
  <rect x="290" y="95" width="150" height="201" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="365" y="122" text-anchor="middle" font-weight="600" fill="#78350f">tether_node</text>
  <text x="365" y="143" text-anchor="middle" font-size="12" fill="#475569">ESP32-S3, C firmware</text>
  <text x="365" y="180" text-anchor="middle" font-size="12">Wi-Fi station / hotspot</text>
  <text x="365" y="200" text-anchor="middle" font-size="12">listeners and outbound</text>
  <text x="365" y="220" text-anchor="middle" font-size="12">connections, 16 channels</text>
  <text x="365" y="250" text-anchor="middle" font-size="12">status LED, USB drive</text>

  <!-- host -->
  <rect x="540" y="95" width="150" height="201" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="615" y="122" text-anchor="middle" font-weight="600" fill="#14532d">tether_host</text>
  <text x="615" y="143" text-anchor="middle" font-size="12" fill="#475569">Python on the PC</text>
  <text x="615" y="180" text-anchor="middle" font-size="12">pushes the TOML config</text>
  <text x="615" y="200" text-anchor="middle" font-size="12">connects to the API,</text>
  <text x="615" y="220" text-anchor="middle" font-size="12">Host / redirect rewrite,</text>
  <text x="615" y="240" text-anchor="middle" font-size="12">HTTPS on the final leg</text>

  <!-- PC side -->
  <rect x="740" y="40" width="140" height="300" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="810" y="66" text-anchor="middle" font-weight="600" fill="#14532d">PC network</text>
  <rect x="755" y="95" width="110" height="56" rx="6" fill="#fff" stroke="#16a34a"/>
  <text x="810" y="119" text-anchor="middle">API server</text>
  <text x="810" y="138" text-anchor="middle" font-size="12" fill="#475569">HTTP, streaming</text>
  <rect x="755" y="240" width="110" height="56" rx="6" fill="#fff" stroke="#16a34a"/>
  <text x="810" y="264" text-anchor="middle">Local program</text>
  <text x="810" y="283" text-anchor="middle" font-size="12" fill="#475569">127.0.0.1:port</text>

  <!-- USB link -->
  <line x1="440" y1="196" x2="540" y2="196" stroke="#0f172a" stroke-width="5"/>
  <text x="490" y="182" text-anchor="middle" font-size="12" font-weight="600">one USB cable</text>
  <text x="490" y="222" text-anchor="middle" font-size="11" fill="#475569">COBS frames,</text>
  <text x="490" y="236" text-anchor="middle" font-size="11" fill="#475569">credits per channel</text>

  <!-- inbound -->
  <line x1="172" y1="123" x2="288" y2="123" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="690" y1="123" x2="753" y2="123" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="105" y="180" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">inbound</text>
  <!-- outbound -->
  <line x1="753" y1="268" x2="692" y2="268" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="288" y1="268" x2="174" y2="268" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="810" y="320" text-anchor="middle" font-size="12" font-weight="600" fill="#14532d">outbound</text>

  <text x="450" y="24" text-anchor="middle" font-size="16" font-weight="600">serial-lan-bridge: two networks, one USB cable, no network adapter</text>
  <text x="450" y="364" text-anchor="middle" font-size="12" fill="#475569">Connections are translated one by one (NAT at connection level): each side sees only the other end of the bridge.</text>
</svg>
