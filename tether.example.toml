# tether.example.toml: copy to tether.toml and edit. Applied to the node on every start.
# Contains Wi-Fi passwords: restrict the file's permissions to your account.

[host]                      # host-only, never sent to the node
port            = "auto"    # "auto" (USB product "tether-node") or e.g. "COM7" / "/dev/ttyACM0"
serial          = ""        # optional USB serial number, to pick one node when several are plugged in
log_level       = "info"    # debug | info | warning | error
connect_timeout = 5         # seconds, connecting to a listener target

[link]
window             = 4096   # flow-control window per channel and direction (1024..16384)
never_used_timeout = 30     # seconds; a connection that carried no data is reset; 0 disables
idle_timeout       = 0      # seconds; 0 disables (recommended: the API's keep-alive ends idle connections)

[wifi]
country = "DE"              # regulatory domain, two letters

[[wifi.network]]            # 1 to 4 networks; the strongest visible one is joined
ssid   = "NetworkB"
psk    = "change-me-please"
hidden = false

[hotspot]                   # remove this whole section for no hotspot
mode     = "auto"           # auto: only when no network can be joined; always: also while connected
ssid     = ""               # empty: tether-XXXX (last two MAC bytes)
psk      = "change-me-too"  # required, 8..63 characters (WPA2)
fallback = 30               # seconds without a station connection before the hotspot starts

[[listener]]                # 1 to 4 listeners
id       = 1
port     = 8000             # port opened on the node
target   = "10.0.0.5:8000"  # where the PC connects: host:port on the PC's network
protocol = "http"           # "http" (503/502/504 replies) or "tcp"
allow    = ["192.168.1.0/24"]   # who may connect; omit for "same subnet as the node"
