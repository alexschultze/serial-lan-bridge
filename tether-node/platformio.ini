; Build with PlatformIO (this is the toolchain the firmware was verified to compile with): pio run
; Plain ESP-IDF works as well through CMakeLists.txt: idf.py set-target esp32s3 && idf.py build
[platformio]
src_dir = main

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
board_build.partitions = partitions.csv
board_upload.flash_size = 4MB
monitor_speed = 115200
